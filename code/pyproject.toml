[project]
name = "langgraph-interrogation-agent"
version = "0.1.0"
description = "A LangGraph and Streamlit based AI Interrogation Simulation system."
authors = [
    {name = "Mingyi Liu"}
]
requires-python = ">=3.11,<4.0"
dependencies = [
    "streamlit (>=1.54.0,<2.0.0)",
    "langgraph (>=1.0.10,<2.0.0)",
    "langchain-core (>=1.2.16,<2.0.0)",
    "pydantic (>=2.12.5,<3.0.0)",
    "requests (>=2.32.5,<3.0.0)",
    "loguru (>=0.7.3,<0.8.0)",
    "python-dotenv (>=1.2.1,<2.0.0)",
    "httpx (>=0.28.1,<0.29.0)",
    "pandas (>=2.0,<3.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pytest (>=9.0.2,<10.0.0)",
    "pytest-asyncio (>=1.3.0,<2.0.0)"
]
